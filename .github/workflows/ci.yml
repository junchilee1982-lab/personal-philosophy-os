name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce tracked files and historical paths
        run: python scripts/check_public_safety.py --tracked --history-paths
      - name: Scan complete Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check src tests scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate agent skill
        run: python scripts/validate_skill.py skills/personal-thought-vault
      - name: Validate agent skill with the official validator
        if: matrix.python != '3.10'
        run: agentskills validate skills/personal-thought-vault
      - name: Enforce public-data boundary
        run: python scripts/check_public_safety.py --tracked --history-paths

  build:
    needs: [safety, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel and source archive
        run: |
          python -m pip install ".[dev]"
          python -m build
      - name: Inspect package contents
        run: |
          python -m zipfile -l dist/*.whl
          tar -tzf dist/*.tar.gz
      - name: Unpack and rescan release artifacts
        run: |
          mkdir -p _artifact_scan/wheel _artifact_scan/sdist
          python -m zipfile -e dist/*.whl _artifact_scan/wheel
          tar -xzf dist/*.tar.gz -C _artifact_scan/sdist
          python scripts/check_public_safety.py --artifact _artifact_scan/wheel
          python scripts/check_public_safety.py --artifact _artifact_scan/sdist
      - name: Fresh-wheel smoke test
        run: |
          python -m venv "$RUNNER_TEMP/ppos-smoke-venv"
          "$RUNNER_TEMP/ppos-smoke-venv/bin/python" -m pip install --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/ppos-smoke-project"
          cd "$RUNNER_TEMP/ppos-smoke-project"
          "$RUNNER_TEMP/ppos-smoke-venv/bin/ppos" init --vault "$RUNNER_TEMP/ppos-smoke-vault" --demo
          "$RUNNER_TEMP/ppos-smoke-venv/bin/ppos" doctor --vault "$RUNNER_TEMP/ppos-smoke-vault"
          "$RUNNER_TEMP/ppos-smoke-venv/bin/ppos" skill install --target both --scope project
          "$RUNNER_TEMP/ppos-smoke-venv/bin/ppos" skill uninstall --target both --scope project
      - name: Generate checksums
        run: |
          python scripts/make_checksums.py dist
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
